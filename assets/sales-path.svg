  <text x="74" y="165" fill="#18263B" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800" letter-spacing="-2">Make every click</text>
  <text x="74" y="223" fill="#18263B" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800" letter-spacing="-2">answer to <tspan fill="#F26B52">sales.</tspan></text>
  <text x="76" y="270" fill="#526073" font-family="Arial, Helvetica, sans-serif" font-size="20">A product-specific Meta Ads skill for the whole path.</text>
