<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">The digital product sales path</title>
  <desc id="desc">A clear path from Meta ad to product page, checkout, paying customer, and retained value.</desc>
