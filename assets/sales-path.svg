<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">The digital product sales path</title>
  <desc id="desc">A precise path diagram from ad creative to product page, checkout, paid customer, and retained value.</desc>
